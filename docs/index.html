<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!-- makes the page fit properly on phones and smaller screens -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Game Completion Tracker</title>
	<!-- links my stylesheet -->
	<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- everything on the page sits inside #app so the css can centre it and limit the width -->
<div id="app">

  <!-- ===== HEADER =====
       title, welcome message and the search box -->
  <header>
    <h1>Game Completion Tracker</h1>
    <p>Welcome Gamers! Here you can track your game completion progress!</p>

    <!-- typing in here filters the game library, script.js does the work -->
    <input type="text" id="search-box" placeholder="Search games...">
  </header>

  <!-- ===== TWO COLUMNS =====
       css puts these two sections side by side (grid) -->
  <div id="columns">

    <!-- ===== MY LIST (left column) =====
         the games you've added -->
    <section id="my-list-section">
      <h2>My List</h2>

      <!-- filter buttons, each one has a data-status that script.js reads
           so it knows which games to show -->
      <div id="filter-buttons">
        <button data-status="All">All</button>
        <button data-status="Playing">Playing</button>
        <button data-status="Completed">Completed</button>
        <button data-status="Backlog">Backlog</button>
        <button data-status="Dropped">Dropped</button>
      </div>

      <!-- empty to start with, script.js fills it with your tracked games
           (each one gets a remove button plus rating and notes boxes) -->
      <ul id="tracked-list"></ul>
    </section>

    <!-- ===== ALL GAMES (right column) =====
         every game from the API -->
    <section id="library-section">
      <h2>All Games</h2>

      <!-- also empty to start with, script.js fills it with all the games
           or just the ones that match the search -->
      <ul id="game-list"></ul>
    </section>

  </div>
</div>

<!-- ===== GAME POPUP =====
     sits outside #app so it can float over the whole page
     hidden by default (display: none), clicking a game fills in the details
     below and then shows this -->
<div id="modal" style="display: none;">
  <!-- these get filled in by script.js when you click a game -->
  <img id="modal-thumbnail">
  <h2 id="modal-title"></h2>
  <p id="modal-genre"></p>
  <p id="modal-platform"></p>
  <p id="modal-release"></p>
  <p id="modal-description"></p>

  <!-- pick a status then add the game to My List -->
  <select id="status-select">
    <option value="Playing">Playing</option>
    <option value="Completed">Completed</option>
    <option value="Backlog">Backlog</option>
    <option value="Dropped">Dropped</option>
  </select>
  <button id="add-button">Add to my list</button>

  <!-- hides the popup again -->
  <button id="modal-close">Close</button>
</div>

<!-- script has to stay at the bottom so everything above is already on the page
     when the JavaScript runs. if it goes higher up it breaks, I found that out the hard way -->
<script src="script.js"></script>
</body>
</html>
